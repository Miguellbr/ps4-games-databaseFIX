    <script>
const I18N={pt:{menuTitle:'Menu',filters:'Filtros',favorites:'Favoritos',history:'Histórico',theme:'Tema',import:'Importar JSON',export:'Exportar minhas bibliotecas',guide:'Guia do site',language:'Idioma',guideTitle:'📖 Guia do site',search:'🔍 Pesquisar jogos...',loading:'Carregando biblioteca...',guideHtml:'<h3>Como usar</h3><p>Pesquise pelo nome do jogo ou abra o menu ☰ para acessar filtros, favoritos, histórico e tema.</p><h3>Importar seu JSON</h3><p>Abra <b>☰ → Importar JSON</b> e selecione seu arquivo. O site reconhece o formato <b>DATA</b> do seu game.json, incluindo URL do PKG, Title ID, região, versão, tamanho, firmware e capa.</p><h3>Exportar</h3><p>Use <b>☰ → Exportar minhas bibliotecas</b> para salvar todas as bibliotecas importadas em um único arquivo de backup. Esse arquivo pode ser importado novamente depois.</p><h3>Modelo de JSON</h3><pre>{\n  "DATA": {\n    "URL_DO_PKG": {\n      "title_id": "CUSA00000",\n      "region": "USA",\n      "name": "Nome do jogo",\n      "version": "01.00",\n      "release": "01-01-2020",\n      "size": 1234567890,\n      "min_fw": "9.00",\n      "cover_url": "https://exemplo.com/capa.png"\n    }\n  }\n}</pre><p>O campo <b>DATA</b> contém a URL do PKG como chave. Os demais campos são metadados opcionais.</p>'},en:{menuTitle:'Menu',filters:'Filters',favorites:'Favorites',history:'History',theme:'Theme',import:'Import JSON',export:'Export my libraries',guide:'Site guide',language:'Language',guideTitle:'📖 Site guide',search:'🔍 Search games...',loading:'Loading library...',guideHtml:'<h3>How to use</h3><p>Search by game name or open the ☰ menu for filters, favorites, history and theme.</p><h3>Import your JSON</h3><p>Open <b>☰ → Import JSON</b> and select your file. The site recognizes the <b>DATA</b> format from your game.json, including PKG URL, Title ID, region, version, size, firmware and cover.</p><h3>Export</h3><p>Use <b>☰ → Export my libraries</b> to save all imported libraries into one backup file. You can import that backup again later.</p><h3>JSON template</h3><pre>{\n  "DATA": {\n    "PKG_URL": {\n      "title_id": "CUSA00000",\n      "region": "USA",\n      "name": "Game name",\n      "version": "01.00",\n      "release": "01-01-2020",\n      "size": 1234567890,\n      "min_fw": "9.00",\n      "cover_url": "https://example.com/cover.png"\n    }\n  }\n}</pre><p>The <b>DATA</b> object uses the PKG URL as its key. The other fields are optional metadata.</p>'}};
function toggleSidebar(force){const s=document.getElementById('sidebar'),o=document.getElementById('sideOverlay');if(!s||!o)return;const open=force===undefined?!s.classList.contains('open'):force;s.classList.toggle('open',open);o.classList.toggle('show',open);document.body.classList.toggle('sidebar-open',open);}

function closeGuide(e){if(!e||e.target===document.getElementById('guideModal'))document.getElementById('guideModal').classList.remove('show');}

const DB_CACHE_NAME='ps4db-index-v10-metadata';
const DB_CACHE_VERSION=1;
const EXPECTED_GAME_COUNT=17065;
let dbCachePromise=null;
function openDatabaseCache(){if(dbCachePromise)return dbCachePromise;dbCachePromise=new Promise((resolve,reject)=>{const req=indexedDB.open(DB_CACHE_NAME,DB_CACHE_VERSION);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('games'))db.createObjectStore('games',{keyPath:'id'});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});return dbCachePromise;}
async function clearDatabaseCache(){try{const db=await openDatabaseCache();await new Promise((resolve,reject)=>{const tx=db.transaction('games','readwrite'),store=tx.objectStore('games'),req=store.clear();req.onsuccess=resolve;req.onerror=()=>reject(req.error);});}catch(err){console.warn('Não foi possível limpar cache local:',err);}}
async function readDatabaseCache(){try{const db=await openDatabaseCache();const games=await new Promise((resolve,reject)=>{const tx=db.transaction('games','readonly'),store=tx.objectStore('games'),out=[];const req=store.openCursor();req.onsuccess=()=>{const cur=req.result;if(cur){out.push(cur.value.game);cur.continue();}else resolve(out);};req.onerror=()=>reject(req.error);});if(games.length<EXPECTED_GAME_COUNT){console.warn('Cache incompleto:',games.length,'de',EXPECTED_GAME_COUNT);await clearDatabaseCache();return [];}return games;}catch(err){console.warn('Cache indisponível:',err);return [];}}
async function writeDatabaseCache(games){if(!Array.isArray(games)||games.length<EXPECTED_GAME_COUNT)throw new Error('Recusa de cache: catálogo incompleto.');const db=await openDatabaseCache();await new Promise((resolve,reject)=>{const tx=db.transaction('games','readwrite'),store=tx.objectStore('games');store.clear();games.forEach((game,i)=>store.put({id:i,game}));tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error('Transação abortada'));});}

function extractCusa(value){const m=String(value||'').toUpperCase().match(/CUSA\d{5}/);return m?m[0]:'';}
function getCusaId(game){

  if(direct)return direct;
  const seen=new Set();
  function scan(value,depth){
    if(depth>3||value==null)return '';
    if(typeof value==='string')return extractCusa(value);
    if(typeof value!=='object'||seen.has(value))return '';
    seen.add(value);
    for(const key of Object.keys(value)){
      const found=scan(value[key],depth+1);
      if(found)return found;
    }
    return '';
  }
  return scan(game,0);
}

    const legacy=map.get(getCusaId(g));
    return legacy?.cover ? {...g,cover_url:g.cover} : g;

}

function parseImportedJSON(data,source){

  if(data&&Array.isArray(data.libraries)){
    data.libraries.forEach(lib=>{
      const libGames=parseImportedJSON({games:lib.games||[]},lib.name||source);
      out.push(...libGames);

  }else if(data&&data.DATA){
    Object.entries(data.DATA).forEach(([url,item])=>out.push(normalizeImportedEntry(url,item,source)));

    data.forEach(x=>out.push(normalizeImportedEntry(x.url||x.pkg_url||'',x,source)));
  }else if(data&&Array.isArray(data.games)){
    data.games.forEach(x=>out.push(normalizeImportedEntry(x.url||x.pkg_url||'',x,source)));

async function importJSONFiles(e){

    try{
      const data=JSON.parse(await file.text());
      if(data&&Array.isArray(data.libraries)){
        data.libraries.forEach(lib=>{
          const games=parseImportedJSON({games:lib.games||[]},lib.name||file.name);
          if(games.length) importedLibraries=importedLibraries.filter(x=>x.name!==lib.name).concat([{name:lib.name,games}]);
        });
        continue;
      }
      const games=parseImportedJSON(data,file.name);
      if(!games.length){alert(file.name+': nenhum jogo reconhecido.');continue;}
      importedLibraries=importedLibraries.filter(x=>x.name!==file.name);
      importedLibraries.push({name:file.name,games});
    }catch(err){
      alert('Não foi possível importar '+file.name+': JSON inválido.');
    }
  }
  localStorage.setItem('ps4db_libraries',JSON.stringify(importedLibraries));

function renderBatch(start=renderedCount, generation=renderGeneration){
  const container=document.getElementById('gamesContainer');
  if(start===0){
    renderGeneration++;
    generation=renderGeneration;
    if(renderTimer){clearTimeout(renderTimer);renderTimer=null;}
    container.innerHTML='';
  }
  if(generation!==renderGeneration)return;
  const end=Math.min(start+BATCH_SIZE,filteredGames.length);
  if(start===0&&filteredGames.length===0){
    container.innerHTML='<div class="empty-state"><div style="font-size:34px;margin-bottom:10px">🔎</div><h3 style="color:var(--text);margin-bottom:7px">Nenhum resultado encontrado</h3><p>Tente parte do nome, o Title ID, a região ou uma grafia parecida.</p></div>';
    document.getElementById('searchInfo').textContent='Nenhum resultado encontrado';
    renderedCount=0;
    return;
  }
  const fragment=document.createDocumentFragment();
  for(let i=start;i<end;i++)fragment.appendChild(createGameCard(filteredGames[i]));
  container.appendChild(fragment);
  queueMetadataGames(filteredGames.slice(start,end));
  renderedCount=end;
  const q=(document.getElementById('searchInput').value||'').trim();
  document.getElementById('searchInfo').textContent=q
    ? (filteredGames.length.toLocaleString()+' resultado(s) para “'+q+'” • carregando '+renderedCount.toLocaleString()+' de '+filteredGames.length.toLocaleString())
    : ('Carregando '+renderedCount.toLocaleString()+' de '+filteredGames.length.toLocaleString()+' jogos…');
  if(end<filteredGames.length && generation===renderGeneration){
    renderTimer=setTimeout(()=>renderBatch(end,generation),16);
  }else{
    renderTimer=null;
    document.getElementById('searchInfo').textContent=q
      ? (filteredGames.length.toLocaleString()+' resultado(s) para “'+q+'” • '+renderedCount.toLocaleString()+' carregados')
      : (renderedCount.toLocaleString()+' de '+filteredGames.length.toLocaleString()+' jogos carregados');
  }
}

function normalizeSearchText(value){return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ');}

function scrollToTop(){gamesContainer.scrollTo({top:0,behavior:'smooth'});}
loadGames();
